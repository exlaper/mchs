<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Районы выезда пожарных частей — Хабаровск и район</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%;font-family:Segoe UI,Arial,sans-serif}#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;top:10px;left:50px;width:330px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:10px;box-shadow:0 1px 8px rgba(0,0,0,.3);padding:10px 12px;font-size:13px;box-sizing:border-box}
.panel h3{margin:0 0 6px;font-size:15px}
.srch{display:flex;gap:6px;margin-bottom:6px}
.srch input{flex:1;font-size:15px;padding:7px 8px;border:2px solid #1f6fd6;border-radius:7px;outline:none;min-width:0}
.srch button{font-size:14px;padding:6px 10px;border:none;border-radius:7px;background:#1f6fd6;color:#fff;cursor:pointer}
.hint{color:#777;font-size:12px;margin-bottom:6px}
#res{margin:6px 0 4px}
.rbox{border-radius:8px;background:#f4f7fb;padding:8px 10px;line-height:1.45}
.rbox .t{font-weight:700;font-size:14px;margin-bottom:4px}
.zrow{display:flex;align-items:center;gap:6px;margin:3px 0}
.zrow .sw{width:14px;height:14px;border-radius:3px;flex:none}
.zrow b{font-size:14px}
.muted{color:#666}.err{color:#b00020}
details{margin-top:6px}summary{cursor:pointer;font-weight:600}
.lst label{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.sw{width:14px;height:14px;border-radius:3px;border:2px solid #0003}
.st{display:flex;align-items:center;gap:4px;white-space:nowrap}.st i{width:14px;height:14px;border-radius:50%;background:#111;border:3px solid #fff;box-shadow:0 0 3px #000}
.st b{background:#fff;border:2px solid;border-radius:6px;padding:1px 6px;font-size:12px}
@media (max-width:600px){.panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:50%}}

.leaflet-control-attribution{font-size:8px!important;background:transparent!important;color:#999!important;padding:0 3px!important;opacity:.55}
.leaflet-control-attribution a{color:#999!important}
.ptop{display:flex;align-items:center;gap:6px}
.ptop h3{flex:1}
#tog{display:none;border:none;background:#eef2f8;border-radius:7px;font-size:14px;padding:5px 10px;cursor:pointer}
#loc{border:none;border-radius:7px;background:#2e9e3a;color:#fff;font-size:14px;padding:6px 10px;cursor:pointer;white-space:nowrap}
@media (max-width:600px){
 .panel{left:6px;right:6px;width:auto;top:auto;bottom:6px;max-height:55%;padding:8px 10px;border-radius:12px}
 .panel h3{font-size:14px}
 .srch input{font-size:16px;padding:9px 8px}
 .srch button,#loc{font-size:15px;padding:9px 12px}
 #tog{display:block}
 .panel.min .hint,.panel.min details,.panel.min #res{display:none}
 .leaflet-control-zoom{display:none}
 .leaflet-top.leaflet-right{top:4px}
}

.sublbl span{display:inline-block;background:rgba(255,255,255,.88);border:2px solid;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700;white-space:nowrap;color:#222}
.lowzoom .sublbl{display:none}

.go{border:3px solid;border-radius:9px;background:#fff;padding:7px 9px;margin:4px 0 8px}
.go .gl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#666}
.go .gk{font-size:21px;font-weight:800;display:flex;align-items:center;gap:7px}
.go .gk .sw{width:16px;height:16px}
.go .gs{font-size:15px;font-weight:700;color:#333}
.go .ga{font-size:12px;color:#444}
.go .gw{font-size:12px;color:#1b5e20;margin-top:3px}
.go .gwarn{font-size:12px;color:#b26a00;margin-top:3px}

.vlbl span{display:inline-block;transform:translateX(-50%);background:rgba(255,255,255,.85);border-radius:5px;padding:0 4px;font-size:11px;font-weight:700;color:#222;white-space:nowrap;box-shadow:0 0 2px rgba(0,0,0,.3)}
.vlow .vlbl{display:none}
.st.ap i{background:#fff;border:3px dashed #111}
.rbtns{display:flex;gap:6px;margin:6px 0 2px}
.rbtns button{flex:1;border:none;border-radius:7px;background:#1f6fd6;color:#fff;font-size:13px;padding:6px 8px;cursor:pointer}
.rbtns button#cfit{background:#eef2f8;color:#222}
.rrow{display:flex;align-items:center;gap:6px}
.rrow label{flex:1}
.rsubbtn{border:1.5px dashed #333;background:#fff;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer}
.rsubbtn.on{background:#222;color:#fff;border-style:solid}
#rural summary{font-size:14px}
</style></head>

const KX=111320*Math.cos(48.46*Math.PI/180), KY=110574;
const xy=p=>[p[0]*KX,p[1]*KY]; // p=[lon,lat]
function inPoly(p,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))ins=!ins;}return ins;}
function distSeg(p,a,b){const P=xy(p),A=xy(a),B=xy(b);const dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy||1;let t=((P[0]-A[0])*dx+(P[1]-A[1])*dy)/L2;t=Math.max(0,Math.min(1,t));return Math.hypot(P[0]-A[0]-t*dx,P[1]-A[1]-t*dy);}
function distPoly(p,poly){if(inPoly(p,poly))return 0;let d=1e12;for(let i=0;i<poly.length;i++){d=Math.min(d,distSeg(p,poly[i],poly[(i+1)%poly.length]));}return d;}
function densify(line){const out=[];for(let i=0;i<line.length;i++){out.push(line[i]);if(i+1<line.length){const a=line[i],b=line[i+1];const A=xy(a),B=xy(b);const n=Math.floor(Math.hypot(B[0]-A[0],B[1]-A[1])/40);for(let k=1;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}}return out;}

function subOf(k,p){
  if(!SUB[k])return null;
  let best=null,bd=1e12;
  for(const sb of SUB[k])for(const poly of sb.g){const d=distPoly(p,poly[0]);const inHole=poly.slice(1).some(hh=>inPoly(p,hh));if(d===0&&!inHole)return sb.n;const dd=d===0?1:d;if(dd<bd){bd=dd;best=sb.n;}}
  return best;
}
function analyze(lines,isPoint){
  // lines: массив линий [[lon,lat],...]
  let pts=[];for(const l of lines)pts=pts.concat(densify(l));
  const cnt={},minD={},sc={};for(const k of DISP){cnt[k]=0;minD[k]=1e12;sc[k]={};}
  let outside=0;
  for(const p of pts){let hit=false;for(const k of DISP){const d=distPoly(p,Z[k]);if(d===0){cnt[k]++;hit=true;const s=subOf(k,p);if(s)sc[k][s]=(sc[k][s]||0)+1;}if(d<minD[k])minD[k]=d;}if(!hit)outside++;}
  // точка в узкой щели между районами (до 60 м) — относим к ближайшему району
  if(isPoint&&pts.length===1&&!DISP.some(k=>cnt[k]>0)){const kk=DISP.slice().sort((a,b)=>minD[a]-minD[b])[0];if(minD[kk]<60){cnt[kk]=1;outside=0;const s=subOf(kk,pts[0]);if(s)sc[kk][s]=1;}}
  const inside=DISP.filter(k=>cnt[k]>0).sort((a,b)=>cnt[b]-cnt[a]);
  const totalIn=inside.reduce((s,k)=>s+cnt[k],0)||1;
  const near=DISP.filter(k=>cnt[k]===0).sort((a,b)=>minD[a]-minD[b]);
  const subs=k=>Object.keys(sc[k]).sort((a,b)=>sc[k][b]-sc[k][a]).map(n=>({n,share:Math.round(sc[k][n]/cnt[k]*100)}));
  return {inside:inside.map(k=>({k,share:Math.round(cnt[k]/totalIn*100),subs:subs(k)})),near:near.slice(0,3).map(k=>({k,d:minD[k]})),outsideShare:Math.round(outside/pts.length*100),isPoint};
}

function parseQuery(q){
  const s=q.replace(/\s+/g,' ').trim();
  const m=s.match(/^(.*?\D)[,\s]+(?:д\.?\s*|дом\s+)?(\d+\s*[а-яa-z]?(?:\s*(?:\/|к\.?|корп\.?|корпус|стр\.?)\s*\d+)?)\s*$/i);
  let street=s,hn=null;
  if(m&&/[а-яё]{3}/i.test(m[1])){street=m[1];hn=m[2].replace(/\s+/g,' ').trim();}
  const nm=street.replace(/,/g,' ').replace(TYPE_RE,' ').replace(/\s+/g,' ').trim();
  return {nm,hn};
}

function findParks(q){

  for(const p of PARKS){let s=0;
    for(const name of [p.n].concat(p.a||[])){const w=pwords(name);const hit=qw.filter(x=>w.some(y=>wmatch(x,y))).length;if(!hit)continue;
      const sc=hit/qw.length+(qt&&ptype(name)===qt?0.3:0)-0.01*Math.max(0,w.length-hit);if(sc>s)s=sc;}
    if(s>bs+1e-9){bs=s;best=[p];}else if(s>0&&Math.abs(s-bs)<1e-9)best.push(p);}
  return bs>=0.5?best.slice(0,5):[];
}
const parkItem=p=>({kind:p.g?'area':'point',rings:p.g||[],p:p.p,title:p.l,note:p.g?'':'Границы этого парка не нанесены на открытые карты — показан его центр.'});

// ---------- определение дома ----------
function locateHouse(H,hn){
  const t=normH(hn);
  const ex=H.find(h=>normH(h.n)===t);if(ex)return{p:ex.p,exact:true,n:ex.n};
  const base=parseInt(t,10);if(isNaN(base))return null;
  const num=H.map(h=>Object.assign({},h,{b:parseInt(normH(h.n),10)})).filter(h=>!isNaN(h.b));
  const same=num.filter(h=>h.b===base).sort((a,b)=>a.n.length-b.n.length);
  if(same.length)return{p:same[0].p,exact:false,n:same[0].n,note:'Дома № '+hn+' в открытой базе карт нет — показан дом № '+same[0].n+'.'};
  let pool=num.filter(h=>h.b%2===base%2);if(!pool.length)pool=num;if(!pool.length)return null;
  const srt=(a,b)=>a.n.length-b.n.length;
  const lo=pool.filter(h=>h.b<base).sort((a,b)=>b.b-a.b||srt(a,b))[0];
  const hi=pool.filter(h=>h.b>base).sort((a,b)=>a.b-b.b||srt(a,b))[0];
  if(lo&&hi&&dist(lo.p,hi.p)<1500){const f=(base-lo.b)/(hi.b-lo.b);
    return{p:[lo.p[0]+(hi.p[0]-lo.p[0])*f,lo.p[1]+(hi.p[1]-lo.p[1])*f],exact:false,note:'Дома № '+hn+' в открытой базе карт нет. Точка поставлена примерно — между домами № '+lo.n+' и № '+hi.n+'. Сверьтесь с 2ГИС.'};}
  const nb=(lo&&hi)?((base-lo.b)<=(hi.b-base)?lo:hi):(lo||hi);
  return{p:nb.p,exact:false,n:nb.n,note:'Дома № '+hn+' в открытой базе карт нет — показан ближайший дом № '+nb.n+'.'};
}

// ---------- шаги поиска ----------
async function streetLookup(nm){
  let res=[],netErr=0;
  try{res=await nominatim(nm,true);}catch(e){netErr++;}
  if(!res.length){try{res=await nominatim(nm,false);}catch(e){netErr++;}}
  const ways=res.filter(r=>r.category==='highway'&&ROAD.test(r.type)&&okName(r.name||r.display_name,nm));
  let lines=[];for(const w of ways)lines=lines.concat(geoLines(w.geojson));
  lines=cityOnly(lines);
  let exactNames=[...new Set(ways.map(w=>w.name).filter(Boolean))],title=ways.length?ways[0].name:'';
  if(!lines.length&&nm){const els=await opQuery('[out:json][timeout:25];('+nameSel('name',nm).map(f=>'way["highway"]'+f+BB()+';').join('')+');out geom;');
    const ws=els.filter(e=>e.geometry&&e.tags&&e.tags.name);
    lines=cityOnly(ws.map(w=>w.geometry.map(p=>[p.lon,p.lat])));
    if(ws.length){title=ws[0].tags.name;exactNames=[...new Set(ws.map(w=>w.tags.name))];}}
  return{lines,exactNames,title};
}
async function areaSearch(q){
  let res=[];try{res=await nominatim(q,false);}catch(e){return null;}
  const a=res.find(r=>r.category!=='highway'&&r.geojson&&/Polygon/.test(r.geojson.type)&&nearCity([+r.lon,+r.lat]));
  if(a)return{kind:'area',rings:geoRings(a.geojson),p:[+a.lon,+a.lat],title:a.name||q};
  const pt=res.find(r=>r.category!=='highway'&&nearCity([+r.lon,+r.lat]));
  if(pt)return{kind:'point',p:[+pt.lon,+pt.lat],title:pt.name||q};
  return null;
}
function notFound(q){show('<div class="rbox err">Не нашёл «'+escH(q)+'» в Хабаровске. Попробуйте выбрать вариант из подсказок или написать иначе (например: «Руднева 36», «парк Динамо»).</div>');}
function setRefining(txt){const r=document.getElementById('refining');if(!r)return;if(txt)r.textContent=txt;else r.remove();}

async function streetSearch(q,nm,myId){
  const s=await streetLookup(nm);if(myId!==searchId)return;
  if(!s.lines.length){notFound(q);return;}
  const item={kind:'street',lines:s.lines,title:s.title||q};
  render([item],true,'Уточняю всю длину улицы…');
  overpass(nm,s.exactNames).then(els=>{if(myId!==searchId)return;
    const full=cityOnly(els.filter(e=>e.geometry).map(w=>w.geometry.map(p=>[p.lon,p.lat])));
    const n0=s.lines.reduce((a,l)=>a+l.length,0),n1=full.reduce((a,l)=>a+l.length,0);
    if(full.length&&n1>n0)render([Object.assign({},item,{lines:full})],false);
  }).catch(()=>{}).finally(()=>{if(myId===searchId)setRefining(null);});
}
async function houseSearch(q,nm,hn,myId){
  const H=normH(hn);
  // 1) быстрый поиск дома по адресу
  let res=[];try{res=await nominatim(hn+' '+nm,true);}catch(e){}
  if(myId!==searchId)return;
  const h=res.find(r=>r.address&&normH(r.address.house_number||'')===H&&okName(r.address.road||r.display_name,nm)&&nearCity([+r.lon,+r.lat]));
  if(h){render([{kind:'point',p:[+h.lon,+h.lat],title:(h.address.road||nm)+', '+hn,hn,stName:h.address.road||nm}],true);return;}
  // 2) показываем улицу и ищем дом в подробной базе
  const s=await streetLookup(nm);if(myId!==searchId)return;
  if(!s.lines.length){notFound(q);return;}
  const stTitle=s.title||nm;
  render([{kind:'street',lines:s.lines,title:stTitle}],true,'Ищу дом № '+hn+' на этой улице (до 30 сек)…');
  let els;try{els=await overpassAddr(nm,s.exactNames);}catch(e){els=null;}
  if(myId!==searchId)return;
  if(!els){setRefining('Не удалось связаться с сервером домов — показана вся улица. Попробуйте ещё раз чуть позже.');return;}
  const houses=els.map(e=>({n:e.tags&&e.tags['addr:housenumber'],p:e.center?[e.center.lon,e.center.lat]:[e.lon,e.lat]})).filter(x=>x.n&&isFinite(x.p[0])&&nearCity(x.p));
  const r=locateHouse(houses,hn);
  if(!r){setRefining('Дом № '+hn+' не найден — показана вся улица.');return;}
  render([{kind:'point',p:r.p,title:stTitle+', '+(r.exact?r.n:hn+' (примерно)'),note:r.note||'',street:s.lines,approx:!r.exact,hn:r.exact?r.n:hn,stName:stTitle}],true);
}

let searchId=0;
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const q=document.getElementById('q').value.trim();if(!q)return;
  if(typeof villageSearch==='function'&&villageSearch(q)){++searchId;return;}
  const myId=++searchId;
  const pk=findParks(q);
  if(pk.length){render(pk.map(parkItem),true);return;}
  const {nm,hn}=parseQuery(q);
  show('<div class="rbox muted">Ищу «'+escH(q)+'»…</div>');
  try{
    if(PARK_RE.test(q)&&!hn){const it=await areaSearch(q);if(myId!==searchId)return;if(it){render([it],true);return;}}
    if(hn)await houseSearch(q,nm,hn,myId);else await streetSearch(q,nm,myId);
  }catch(err){if(myId===searchId)show('<div class="rbox err">Не удалось выполнить поиск: '+escH(err.message)+'. Проверьте интернет.</div>');}
});

let hl=null;

function show(html){resEl.innerHTML=html;}
function zoneRow(k,extra){return '<div class="zrow"><span class="sw" style="background:'+C[k]+'"></span><b>'+SH[k]+'</b><span class="muted">'+extra+'</span></div>';}
const fmtD=d=>d<1000?Math.round(d/10)*10+' м':(d/1000).toFixed(1).replace('.',',')+' км';
const ll=l=>l.map(p=>[p[1],p[0]]);
function areaSample(rings){
  const out=[];
  for(const r of rings){let w=1e9,e=-1e9,s=1e9,n=-1e9;for(const p of r){w=Math.min(w,p[0]);e=Math.max(e,p[0]);s=Math.min(s,p[1]);n=Math.max(n,p[1]);}
    for(let i=0;i<=14;i++)for(let j=0;j<=14;j++){const p=[w+(e-w)*i/14,s+(n-s)*j/14];if(inPoly(p,r))out.push([p]);}}
  return out;
}
// ---------- какая часть выезжает ----------

];
// объекты АО «ННК-Хабаровский НПЗ» вне завода, куда дополнительно направляется 4 ПСЧ
const NPZ_OBJ=[['металлистов','17','Здание заводоуправления','401'],['забайкальская','22а','Здание управления экономической безопасности','401'],['орджоникидзе','23а','Здание заводоуправления (новое)','401'],['павловская','16','НПЗ-2 (электроподстанция)','402']];
const stKey=s=>low(s).replace(/[«»"]/g,'');
function distSub(p,k,n){let d=1e12;for(const sb of SUB[k]||[])if(sb.n===n)for(const poly of sb.g)d=Math.min(d,distPoly(p,poly[0]));return d;}
function parityOf(hn){const n=parseInt(normH(hn||''),10);return isNaN(n)?null:(n%2===0?'ч':'н');}
function decide(it,a){
  const p=it.p,res={k:null,sub:null,why:'',warn:[],extra:''};
  if(a.inside.length){res.k=a.inside[0].k;res.sub=subOf(res.k,p);}
  const par=parityOf(it.hn),st=stKey(it.stName||'');
  if(par&&st){
    let best=null,bd=250;
    for(const r of SIDE){if(!st.includes(r[0]))continue;if(r[1]!=='*'&&r[1]!==par)continue;
      const d=r[2]==='1'||SUB[r[2]]?distSub(p,r[2],r[3]):1e12;if(d<bd){bd=d;best=r;}}
    if(best){
      const was=res.k;res.k=best[2];res.sub=best[3];
      res.why=(best[1]==='*'?'Улица целиком':(par==='ч'?'Чётная':'Нечётная')+' сторона')+' этого участка улицы по описанию границ относится к '+SH[best[2]]+', подрайон № '+best[3]+'.';
      if(was&&was!==best[2])res.why+=' (По карте точка попала в район '+SH[was]+', но решает сторона улицы.)';
    }
  }
  if(!res.k){const n=a.near[0];if(n){res.k=n.k;res.sub=subOf(n.k,p);res.warn.push('Адрес вне нанесённых районов выезда — указан ближайший район ('+fmtD(n.d)+').');}}
  if(!res.why&&res.k){const nb=a.near.filter(z=>z.k!==res.k&&z.d<150);if(nb.length)res.warn.push('Адрес у границы с районом '+SH[nb[0].k]+' ('+fmtD(nb[0].d)+'). Если дом стоит на граничной улице — уточните сторону улицы по схеме.');}
  // объекты НПЗ
  return res;
}
function decideBox(it,a){
  const r=decide(it,a);if(!r.k)return '';
  let h='<div class="go" style="border-color:'+C[r.k]+'"><div class="gl">Выезжает</div><div class="gk"><span class="sw" style="background:'+C[r.k]+'"></span>'+SH[r.k]+(r.sub?' <span class="gs">· подрайон № '+r.sub+'</span>':'')+'</div><div class="ga">'+NM[r.k]+'</div>';
  if(r.k==='У')h+='<div class="ga">Район выезда 35 ПЧ — реагирует учебная пожарная часть (ранги № 1 — № 3).</div>';
  if(r.why)h+='<div class="gw">'+r.why+'</div>';
  for(const w of r.warn)h+='<div class="gwarn">⚠ '+w+'</div>';
  if(r.extra)h+='<div class="gw">'+r.extra+'</div>';
  return h+'</div>';
}
// для улицы без номера дома: кто обслуживает какую сторону
function sideInfo(stName){
  const st=stKey(stName||'');const rs=SIDE.filter(r=>st.includes(r[0]));if(!rs.length)return '';
  const g={ч:[],н:[],'*':[]};for(const r of rs){const t=SH[r[2]]+' п/р '+r[3];if(!g[r[1]].includes(t))g[r[1]].push(t);}
  let h='<div style="margin-top:6px"><b>Граничная улица.</b> По описанию границ (на разных участках):</div>';
  if(g['*'].length)h+='<div class="muted">обе стороны: '+g['*'].join(', ')+'</div>';
  if(g.ч.length)h+='<div class="muted">чётная сторона: '+g.ч.join(', ')+'</div>';
  if(g.н.length)h+='<div class="muted">нечётная сторона: '+g.н.join(', ')+'</div>';
  return h+'<div class="muted" style="font-size:12px">Введите номер дома — сайт точно скажет, какая часть выезжает.</div>';
}

function subTxt(z,single){
  if(!z.subs||!z.subs.length)return '';
  if(single||z.subs.length===1)return ' — подрайон № '+z.subs[0].n;
  return ' (подрайоны: '+z.subs.filter(s=>s.share>=3).map(s=>'№ '+s.n+' — '+s.share+'%').join(', ')+')';
}
function resultBox(it){
  let lines,what;
  if(it.kind==='street'){lines=it.lines;what='улицы';}
  else if(it.kind==='area'){lines=it.rings.concat(areaSample(it.rings));what='территории';}
  else{lines=[[it.p]];what='';}
  const a=analyze(lines,it.kind==='point');
  let h='<div class="rbox" style="margin-bottom:6px"><div class="t">'+escH(it.title)+'</div>';
  if(it.kind==='point'||it.kind==='area')h+=decideBox(Object.assign({p:it.p||it.rings[0][0]},it),a);
  if(it.note)h+='<div class="muted" style="font-size:12px;margin-bottom:4px">'+escH(it.note)+'</div>';
  if(it.kind==='point'||it.kind==='area'&&a.inside.length===1&&a.inside[0].subs.length<=1){}
  else if(a.inside.length){
    if(it.kind==='point'||a.inside.length===1&&it.kind==='area'){h+='<div>Район выезда:</div>';for(const z of a.inside)h+=zoneRow(z.k,subTxt(z,true));}
    else{h+='<div>'+(it.kind==='street'?'Проходит через районы:':'Территория в районах:')+'</div>';for(const z of a.inside)h+=zoneRow(z.k,' — '+z.share+'% '+what+subTxt(z,false));}
    if(it.kind!=='point'&&a.outsideShare>15)h+='<div class="muted">≈'+a.outsideShare+'% '+what+' — вне нанесённых районов.</div>';
  }else h+='<div class="err">Вне нанесённых районов выезда.</div>';
  const nb=a.near.filter(z=>z.d<1500);
  if(nb.length){h+='<div style="margin-top:6px">Ближайшие соседние районы:</div>';for(const z of nb)h+=zoneRow(z.k,' — '+fmtD(z.d));}
  else if(!a.inside.length){h+='<div style="margin-top:6px">Ближайшие районы:</div>';for(const z of a.near)h+=zoneRow(z.k,' — '+fmtD(z.d));}
  if(it.kind==='street')h+=sideInfo(it.title);
  if(it.kind!=='street'){
    const c=it.p||it.rings[0][0];
    const sd=DISP.map(k=>({k,d:dist(c,[ST[k][1],ST[k][0]])})).sort((x,y)=>x.d-y.d).slice(0,3);
    h+='<div style="margin-top:6px">Ближайшие части (по прямой):</div>';for(const z of sd)h+=zoneRow(z.k,' — '+fmtD(z.d));
  }
  return h+'</div>';
}
function render(items,fit,refining){
  if(hl)map.removeLayer(hl);
  hl=L.featureGroup().addTo(map);
  let h='';
  for(const it of items){
    if(it.street)for(const l of it.street)L.polyline(ll(l),{color:'#ffeb3b',weight:5,opacity:.8}).addTo(hl);
    if(it.kind==='street')for(const l of it.lines){L.polyline(ll(l),{color:'#000',weight:9,opacity:.9}).addTo(hl);L.polyline(ll(l),{color:'#ffeb3b',weight:5}).addTo(hl);}
    else if(it.kind==='area'&&it.rings.length){for(const r of it.rings)L.polygon(ll(r),{color:'#000',weight:3,fillColor:'#ffeb3b',fillOpacity:.65}).bindPopup('<b>'+escH(it.title)+'</b>').addTo(hl);}
    if(it.kind==='point'||it.kind==='area'&&!it.rings.length){
      L.circleMarker([it.p[1],it.p[0]],{radius:it.approx?11:9,color:'#000',weight:3,fillColor:it.approx?'#ff9800':'#ffeb3b',fillOpacity:1,dashArray:it.approx?'4 3':null}).bindPopup('<b>'+escH(it.title)+'</b>').addTo(hl);
    }
    h+=resultBox(it);
  }
  if(fit){
    if(items.length===1&&items[0].kind==='point')map.setView([items[0].p[1],items[0].p[0]],16);
    else map.fitBounds(hl.getBounds(),{padding:[60,60],maxZoom:16});
  }
  if(refining)h+='<div id="refining" class="muted" style="margin:2px 0 4px;font-size:12px">'+escH(refining)+'</div>';
  show(h);
}

  return '<div style="max-width:280px;line-height:1.4">'+h+'</div>';
}

const rGroups={},rPolys={},rLabels=L.featureGroup(),rStations=L.featureGroup(),rAll=L.featureGroup();
for(const k of RORD)rGroups[k]=L.featureGroup();
for(const n in RV){
  const k=VOWN[n];if(!k)continue;const v=RV[n],col=RP[k].c;
  if(v.g.length){rPolys[n]=L.polygon(v.g.map(r=>r.map(p=>[p[1],p[0]])),{color:col,weight:2.5,fillColor:col,fillOpacity:.45}).bindPopup(()=>vPopup(n)).addTo(rGroups[k]);}
  else{rPolys[n]=L.circleMarker([v.c[1],v.c[0]],{radius:9,color:col,weight:3,fillColor:col,fillOpacity:.45,dashArray:'4 3'}).bindPopup(()=>vPopup(n)).addTo(rGroups[k]);}
  L.marker([v.c[1],v.c[0]],{icon:L.divIcon({className:'vlbl',html:'<span>'+escH(vName(n))+'</span>',iconSize:null,iconAnchor:[0,-8]}),interactive:false}).addTo(rLabels);
}
for(const k of RORD){
  if(RP[k].st)L.marker(RP[k].st,{zIndexOffset:500,icon:L.divIcon({className:'',html:'<div class="st'+(RP[k].ap?' ap':'')+'"><i></i><b style="border-color:'+RP[k].c+'">'+rsh(k)+(RP[k].ap?' ≈':'')+'</b></div>',iconSize:null,iconAnchor:[10,10]})})
    .bindPopup('<b>'+rsh(k)+'</b><div style="font-size:12px;margin-top:3px">'+escH(RP[k].a)+'</div><div style="font-size:12px;margin-top:3px">Район выезда: '+(RP[k].r.length?RP[k].r.map(vName).join(', '):'НПС-34')+'</div>').addTo(rGroups[k]);
  rGroups[k].addTo(rAll);
}
rAll.addTo(map);rLabels.addTo(map);
function vlowCls(){map.getContainer().classList.toggle('vlow',map.getZoom()<11);}
map.on('zoomend',vlowCls);vlowCls();

// --- подсветка подрайона части
let subHL=null,subOn=null;
function showSub(k,btn){
  if(subHL){map.removeLayer(subHL);subHL=null;}
  document.querySelectorAll('.rsubbtn').forEach(b=>b.classList.remove('on'));
  if(subOn===k){subOn=null;return;}
  subOn=k;subHL=L.featureGroup().addTo(map);
  for(const n of (RP[k].s||[])){const v=RV[n];if(!v)continue;
    if(v.g.length)L.polygon(v.g.map(r=>r.map(p=>[p[1],p[0]])),{color:'#111',weight:3,dashArray:'6 5',fill:false,interactive:false}).addTo(subHL);
    else L.circleMarker([v.c[1],v.c[0]],{radius:13,color:'#111',weight:3,dashArray:'6 5',fill:false,interactive:false}).addTo(subHL);}
  if(btn)btn.classList.add('on');
  if(subHL.getLayers().length)map.fitBounds(subHL.getBounds(),{padding:[40,40]});
}

// --- панель
{
  const box=document.createElement('details');box.open=true;box.id='rural';
  let h='<summary>Хабаровский район — части и сёла</summary><div class="rbtns"><button type="button" id="rfit">Показать все сёла</button><button type="button" id="cfit">Город</button></div>';
  h+='<div class="hint" style="margin:4px 0">Заливка — район выезда части. Кнопка «подрайон» обводит пунктиром сёла её подрайона. Нажмите на село — будет часть и ранг № 1.</div><div class="lst">';
  for(const k of RORD){
    h+='<div class="rrow"><label><input type="checkbox" data-k="'+k+'" checked><span class="sw" style="background:'+RP[k].c+'"></span><b>'+rsh(k)+'</b><span class="muted" style="font-size:11px"> '+RP[k].r.length+' нп</span></label>'+
       (RP[k].s?'<button type="button" class="rsubbtn" data-k="'+k+'">подрайон</button>':'')+'</div>';
  }
  h+='</div>';box.innerHTML=h;
  document.querySelector('.panel').appendChild(box);
  box.querySelectorAll('input[data-k]').forEach(i=>i.onchange=e=>{const g=rGroups[i.dataset.k];e.target.checked?rAll.addLayer(g):rAll.removeLayer(g);});
  box.querySelectorAll('.rsubbtn').forEach(b=>b.onclick=()=>showSub(b.dataset.k,b));
  document.getElementById('rfit').onclick=()=>map.fitBounds(rAll.getBounds(),{padding:[20,20]});
  document.getElementById('cfit').onclick=()=>map.fitBounds(all.getBounds(),{padding:[20,20]});
}

// --- поиск по названию села
const vnorm=s=>low(s).replace(/^(с\.|село|п\.|пос\.|посёлок|поселок|рп\.?|д\.)\s*/,'').replace(/[-–]/g,' ').replace(/\s+/g,' ').replace(/й/g,'и').trim();
function villageSearch(q){
  const nq=vnorm(q);if(nq.length<3)return false;
  let hits=Object.keys(RV).filter(n=>VOWN[n]&&vnorm(n)===nq);
  if(!hits.length&&nq.length>=4)hits=Object.keys(RV).filter(n=>VOWN[n]&&vnorm(n).startsWith(nq));
  if(!hits.length||hits.length>4)return false;
  if(hl)map.removeLayer(hl);hl=L.featureGroup().addTo(map);let h='';
  for(const n of hits){const v=RV[n];
    if(v.g.length)L.polygon(v.g.map(r=>r.map(p=>[p[1],p[0]])),{color:'#000',weight:3,fillColor:'#ffeb3b',fillOpacity:.6}).addTo(hl);
    else L.circleMarker([v.c[1],v.c[0]],{radius:11,color:'#000',weight:3,fillColor:'#ffeb3b',fillOpacity:1}).addTo(hl);
    const k=VOWN[n];
    h+='<div class="rbox" style="margin-bottom:6px"><div class="t">'+escH(vName(n))+'</div><div class="go" style="border-color:'+RP[k].c+'"><div class="gl">Район выезда</div><div class="gk"><span class="sw" style="background:'+RP[k].c+'"></span>'+rsh(k)+'</div><div class="ga">'+escH(RP[k].a)+'</div>'+
       (VSUB[n]?'<div class="gw">Подрайон: '+VSUB[n].map(rsh).join(', ')+'</div>':'')+(RTAB[n]?'<div class="gwarn">⚠ В таблице Расписания указано: '+RTAB[n]+'</div>':'')+'</div>'+
       (R1[n]?'<div><b>Ранг № 1:</b> '+R1[n].map(x=>escH(x[0])+' — '+x[1]+' мин').join('; ')+'</div>':'')+(RNOTE[n]?'<div class="muted" style="font-size:12px">'+escH(RNOTE[n])+'</div>':'')+'</div>';}
  map.fitBounds(hl.getBounds(),{padding:[80,80],maxZoom:14});show(h);return true;
}
dl.innerHTML+=Object.keys(RV).filter(n=>VOWN[n]).map(n=>'<option value="'+vName(n).replace(/"/g,'&quot;')+'">').join('');

</script></body></html>
